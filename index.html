<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rheumatoid Arthritis Clinical Guide</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2030;--mu:#5d6580;--ac:#2f5fb3;--ac2:#e6eefb;--bd:#dde1ee;--ok:#1d7a4d;--wa:#b36b00;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--tx:#e8ebf5;--mu:#9aa3bf;--ac:#7aa5f0;--ac2:#243252;--bd:#2d3550;--ok:#5fd09a;--wa:#e8b04a;--bad:#f2766e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--tx:#e8ebf5;--mu:#9aa3bf;--ac:#7aa5f0;--ac2:#243252;--bd:#2d3550;--ok:#5fd09a;--wa:#e8b04a;--bad:#f2766e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:14px 16px 4px}h1{font-size:19px;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:12.5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:20px;font-size:13.5px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:4px 12px 40px;max-width:820px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
h2{font-size:16px;margin:0 0 6px;color:var(--ac)}h3{font-size:14px;margin:10px 0 4px}
ul{margin:4px 0;padding-left:20px}li{margin:2px 0}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
select,input{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:26px;font-weight:700}.tag{display:inline-block;padding:2px 9px;border-radius:10px;background:var(--ac2);color:var(--ac);font-size:12px;margin:2px 2px 2px 0}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:12.5px;min-width:560px}th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--ac2)}
details{border-top:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;font-weight:600}
.src{font-size:11.5px;color:var(--mu)}
.ck{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:14px}.ck input{width:auto;margin-top:4px}
footer{padding:0 16px 30px;color:var(--mu);font-size:11.5px;max-width:820px;margin:auto}
</style></head><body>
<header><h1>Rheumatoid Arthritis Guide</h1><p>Harrison’s 21e Ch. 358 (Shah &amp; St. Clair) + EULAR 2025 update · for clinician education</p></header>
<nav id="nav"></nav><main id="m"></main>
<footer>Decision-support/education tool, not a substitute for clinical judgment. Doses per Harrison’s Table 358-2; verify against current labels and local protocols.</footer>
<script>
const S=[['assess','Assess'],['patho','Pathophysiology'],['tests','Tests'],['dx','Diagnosis'],['tx','Treatment'],['upd','Guideline update']];
const $=id=>document.getElementById(id);
const sel=(id,opts,f)=>`<label>${f}</label><select id="${id}" onchange="calc()">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
const num=(id,f,mx)=>`<div><label>${f}</label><input id="${id}" type="number" min="0" max="${mx}" step="any" oninput="calc()"></div>`;
const li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const card=(t,b)=>`<div class="c"><h2>${t}</h2>${b}</div>`;
const det=(t,b)=>`<details><summary>${t}</summary>${b}</details>`;

const V={};
V.assess=()=>card('Symptoms &amp; signs checklist',`<p class="src">Tick what applies; suspicion rises with each feature.</p>`+
['Morning stiffness &gt;1 h that eases with activity','Symmetric swelling of small joints of hands/feet (MCP, PIP, wrists, MTP)','Pain on MTP squeeze / MCP squeeze','Flexor tenosynovitis, trigger fingers, reduced grip','Symptoms ≥6 weeks','Smoker / family history (first-degree relative 2–10× risk)','Deformity: ulnar deviation, swan-neck, boutonnière, Z-thumb, piano-key ulnar styloid'].map((x,i)=>`<label class="ck"><input type="checkbox" class="sy" onchange="calc()">${x}</label>`).join('')+`<div id="syo" class="src"></div>`)+
card('2010 ACR/EULAR classification score',`<p class="src">For patients with ≥1 joint with definite clinical synovitis not better explained by another disease. Score ≥6/10 = definite RA.</p>`+
sel('j',[[0,'1 large joint'],[1,'2–10 large joints'],[2,'1–3 small joints'],[3,'4–10 small joints'],[5,'&gt;10 joints (≥1 small)']],'Joint involvement')+
sel('s',[[0,'RF and ACPA negative'],[2,'Low-positive RF or ACPA (≤3× ULN)'],[3,'High-positive RF or ACPA (&gt;3× ULN)']],'Serology')+
sel('a',[[0,'Normal CRP and ESR'],[1,'Abnormal CRP or ESR']],'Acute-phase reactants')+
sel('d',[[0,'&lt;6 weeks'],[1,'≥6 weeks']],'Duration of symptoms')+`<div id="cls" class="big"></div><div id="cls2"></div>`)+
card('Disease activity (CDAI / SDAI)',`<div class="r">${num('tj','Tender joints (0–28)',28)}${num('sj','Swollen joints (0–28)',28)}${num('pg','Patient global (0–10)',10)}${num('eg','Evaluator global (0–10)',10)}</div><div class="r">${num('crp','CRP (mg/dL) – optional for SDAI')}<div></div></div><div id="da"></div><p class="src">Harrison’s remission (ACR/EULAR): TJC ≤1, SJC ≤1, CRP ≤1 mg/dL, patient global ≤1 — or SDAI ≤3.3.</p>`)+
card('Extra-articular screen (up to 40%)',li(['Constitutional: weight loss, fatigue, fever &gt;38.3 °C (think vasculitis/infection)','Nodules (30–40%), secondary Sjögren’s (~10%): dry eyes/mouth','Lung: dry cough, progressive dyspnoea (ILD), pleuritic pain, nodules','Cardiac: pericarditis, cardiomyopathy, mitral regurgitation; CV disease is the leading cause of death','Vasculitis: purpura, digital infarcts, ulcers, mononeuritis multiplex','Haem: anaemia, Felty’s (neutropenia + splenomegaly), LGL leukaemia, lymphoma risk 2–4×','Neck: C1–C2 instability → myelopathy; bone: osteoporosis']));

V.patho=()=>card('Aetiology &amp; risk',li(['Prevalence ~0.5–1%; F:M 2–3:1; onset peaks 25–55 y','Heritability 40–50%; HLA-DRB1 shared epitope (*0401, *0404, *0101, *0405, *0901); PTPN22, PADI4, STAT4, CTLA4, TRAF1-C5','Smoking: RR 1.5–3.5; SE alleles + smoking → 20–40-fold risk of ACPA+ RA','Citrullination (PAD enzymes) in lung/gum; <i>P. gingivalis</i> (periodontitis), gut dysbiosis (<i>Prevotella copri</i>), EBV hypothesised']))+
card('Pathogenesis',li(['Loss of self-tolerance: RF/ACPA appear years before clinical disease','Citrullinated peptides bind shared epitope → CD4+ T-cell activation (TCR + CD28–CD80/86)','Th1/Th17 (IL-17), B cells → plasma cells → RF/ACPA immune complexes','Macrophages: TNF-α, IL-1, IL-6, IL-12, IL-15, IL-18, IL-23; synovial fibroblasts: IL-6, MMPs','TLR2/3/4 signalling on synovial fibroblasts amplifies inflammation','Intracellular pathways: JAK/STAT, Syk, MAPK, NF-κB','Treg dysfunction (CTLA-4) uncertain']))+
card('Joint destruction',li(['Pannus: hyperplastic synovium of fibroblast-like synoviocytes + granulation tissue; infiltrate = T (30–50%), B, plasma, dendritic, mast cells','RANKL (fibroblasts, T cells) ↑ by TNF/IL-1/IL-6/IL-17 → osteoclasts (cathepsin K) → marginal erosions at bare areas','TNF induces DKK-1 → Wnt blockade → ↓ bone formation; OPG is the decoy receptor','Cartilage: MMPs, proteoglycan loss near pannus; periarticular osteopenia; generalised osteoporosis']));

V.tests=()=>card('Suggested work-up',`<div class="scroll"><table><tr><th>Test</th><th>Role / interpretation</th></tr>
<tr><td>RF (IgM)</td><td>Positive in ~75%; not specific (Sjögren’s, SLE, cryoglobulinaemia, HBV/HCV, endocarditis; 1–5% healthy)</td></tr>
<tr><td>Anti-CCP / ACPA</td><td>Sensitivity ≈ RF, specificity ~95%; best prognostic marker; test both</td></tr>
<tr><td>ESR, CRP</td><td>Inflammation; part of classification &amp; activity scores</td></tr>
<tr><td>CBC, creatinine, LFTs</td><td>Normocytic anaemia, thrombocytosis; baseline before DMARDs</td></tr>
<tr><td>ANA</td><td>~30% positive; rule out SLE/CTD (ANCA, anti-MPO/PR3 not expected)</td></tr>
<tr><td>Synovial fluid</td><td>WBC 5,000–50,000/µL (neutrophils) vs &lt;2,000 in OA; exclude infection and crystals</td></tr>
<tr><td>X-ray hands/feet</td><td>Soft-tissue swelling, symmetric space loss, erosions; baseline and follow-up</td></tr>
<tr><td>Ultrasound (power Doppler)</td><td>Synovitis, effusion, erosions earlier than X-ray; portable</td></tr>
<tr><td>MRI</td><td>Most sensitive: synovitis, bone marrow oedema (predicts erosions)</td></tr>
<tr><td>HRCT chest, PFT (DLCO)</td><td>If cough/dyspnoea: ILD (UIP vs NSIP), restrictive pattern</td></tr>
<tr><td>Pre-biologic screen</td><td>TB (TST/IGRA), HBsAg/anti-HBc, HCV; G6PD before sulfasalazine; eye exam before HCQ if &gt;40 y/eye disease</td></tr>
<tr><td>Echo / ECG, DEXA, lipids</td><td>CV risk, pericardial effusion, osteoporosis, before IL-6/JAK drugs</td></tr></table></div>`);

V.dx=()=>card('Diagnostic approach',li(['Clinical diagnosis: chronic inflammatory polyarthritis (≥6 weeks), symmetric, small joints, with supportive labs/imaging','Use 2010 criteria to classify early disease; score ≥6 = definite RA (see Assess)','Undifferentiated arthritis more likely to become RA with many tender/swollen joints, RF/ACPA+, high disability scores','Up to 10% remit spontaneously within 6 months (esp. seronegative)','~75% seropositive; ~25% seronegative']))+
card('Differential diagnosis',`<div class="scroll"><table><tr><th>Mimic</th><th>Clue</th></tr>
<tr><td>Viral arthritis (parvo, HBV, HCV)</td><td>Transient (2–3 wk); HCV: RF+ in half, ACPA−</td></tr>
<tr><td>Primary Sjögren’s</td><td>Sicca; 50% RF+; mild synovitis</td></tr>
<tr><td>Psoriatic / enteropathic SpA</td><td>Sacroiliitis, enthesitis, psoriasis, IBD; DIP, dactylitis</td></tr>
<tr><td>Osteoarthritis</td><td>DIP/CMC, short stiffness, synovial WBC &lt;2000</td></tr>
<tr><td>Polymyalgia rheumatica</td><td>Elderly, shoulder/hip girdle; seronegative RA can mimic</td></tr>
<tr><td>RS3PE, paraneoplastic</td><td>Distal pitting oedema, steroid-responsive</td></tr>
<tr><td>Gout / pseudogout</td><td>Crystals; tophi can mimic nodules</td></tr>
<tr><td>SLE and other CTD</td><td>ANA, dsDNA, skin/renal; non-erosive arthritis</td></tr></table></div>`)+
card('Prognostic markers',li(['Poor: high RF/ACPA titres, high CRP/ESR, many swollen joints, early erosions, smoking, extra-articular disease','Mortality 2× general population (IHD, then infection); lifespan shortened 7 y men / 3 y women']));

V.tx=()=>card('Principles (treat-to-target)',li(['Early, aggressive DMARD therapy; refer early to rheumatology','Target: remission or low disease activity; reassess every 1–3 months and escalate','Minimise long-term glucocorticoids; individualise to comorbidity and toxicity']))+
card('Stepwise approach',li(['<b>Step 1:</b> Methotrexate (anchor) + folic acid ± short-course GC bridge; intra-articular steroid for few joints (exclude infection)','<b>Inadequate response (3–6 mo):</b> add/switch to oral triple therapy (MTX + SSZ + HCQ), MTX + leflunomide, or MTX + biologic/tsDMARD','<b>Biologic:</b> TNF inhibitor (with MTX), abatacept, tocilizumab/sarilumab, rituximab (seropositive, refractory)','<b>JAK inhibitor:</b> weigh thrombosis, MACE, malignancy, infection (higher vs TNFi in at-risk patients)','<b>Failure of one agent:</b> swap within or between mechanisms (e.g. abatacept after TNFi)','NSAIDs: adjunct only, shortest course; Prednisone 5–10 mg/d only if unavoidable (bone protection ± GI risk)']))+
card('DMARD reference (Harrison’s Table 358-2)',`<div class="scroll"><table><tr><th>Drug</th><th>Dose</th><th>Key toxicity</th><th>Before / monitor</th></tr>
<tr><td>Hydroxychloroquine</td><td>200–400 mg/d (≤5 mg/kg)</td><td>Retinal toxicity, cardiotoxicity</td><td>Eye exam if &gt;40 y; OCT/fields yearly</td></tr>
<tr><td>Sulfasalazine</td><td>500 mg bd → 1–1.5 g bd</td><td>Granulocytopenia, haemolysis (G6PD)</td><td>CBC, LFT, G6PD; CBC q2–4 wk ×3 mo</td></tr>
<tr><td>Methotrexate</td><td>10–25 mg/week PO/SC + folic acid 1 mg/d</td><td>Hepatotoxic, myelosuppression, ILD, teratogenic</td><td>CBC, LFT, hepatitis panel, CXR; CBC/Cr/LFT q2–3 mo</td></tr>
<tr><td>Leflunomide</td><td>10–20 mg/d</td><td>Hepatotoxic, myelosuppression, teratogenic</td><td>CBC, LFT, hepatitis panel</td></tr>
<tr><td>Infliximab</td><td>3 mg/kg IV wk 0, 2, 6 then q8wk</td><td>Infection, TB reactivation, drug-induced lupus</td><td>TB screen; LFTs</td></tr>
<tr><td>Etanercept / Adalimumab / Golimumab / Certolizumab</td><td>50 mg wk / 40 mg q2wk / 50 mg monthly / 400 mg wk 0,2,4 then 200 mg q2wk</td><td>As anti-TNF; avoid in HBV, NYHA III/IV HF</td><td>TB screen</td></tr>
<tr><td>Abatacept</td><td>IV by weight (500/750/1000 mg) wk 0,2,4 then q4wk, or 125 mg SC wk</td><td>Infection</td><td>TB screen</td></tr>
<tr><td>Anakinra</td><td>100 mg SC daily</td><td>Infection, neutropenia</td><td>CBC monthly ×3</td></tr>
<tr><td>Rituximab</td><td>1000 mg IV d0, d14; repeat ≥24 wk; methylpred 100 mg</td><td>Infection, HBV reactivation, PML (rare)</td><td>CBC, hepatitis panel</td></tr>
<tr><td>Tocilizumab / Sarilumab</td><td>4–8 mg/kg IV monthly or 162 mg SC q2wk (wkly if ≥100 kg) / 200 mg SC q2wk</td><td>Infection, LFT↑, lipids↑, cytopenias</td><td>TB screen; CBC, LFT, lipids</td></tr>
<tr><td>JAK inhibitors</td><td>Tofacitinib 5 mg bd; Upadacitinib 15 mg/d; Baricitinib 2 mg/d</td><td>Infection, zoster, thrombosis, dyslipidaemia</td><td>TB screen; CBC, LFT, lipids</td></tr></table></div>`)+
card('Special situations',det('Extra-articular',li(['Treat underlying RA aggressively; RA-ILD: high-dose steroids, azathioprine, mycophenolate, rituximab (MTX/leflunomide pulmonary toxicity)','Vasculitis: immunosuppression ± cytotoxics; skin grafting for ulcers']))+det('Pregnancy',li(['Up to 75% improve, flare postpartum','Safest: low-dose prednisone, HCQ, SSZ; MTX and leflunomide contraindicated','Biologics: limited data; generally safe through 2nd trimester']))+det('Elderly',li(['Similar efficacy/safety of DMARDs/biologics; infection risk higher','Adjust MTX for renal function; avoid if creatinine &gt;2 mg/dL']))+det('Bone, CV, infection',li(['Bisphosphonate (or denosumab/teriparatide) per fracture risk, esp. with steroids','CV risk factor control; inflammation drives risk','Screen TB/hepatitis; prophylaxis where endemic (Global challenges)']))+det('Non-drug &amp; surgery',li(['150 min/week moderate–vigorous activity, strength training, PT/OT','Wrist splints, foot orthotics','Arthroplasty (large joints), silicone MCP implants, wrist/foot arthrodesis'])));

V.upd=()=>card('EULAR 2025 update (Ann Rheum Dis 2026)',li(['5 overarching principles and 9 recommendations (down from 11 in 2022)','Shared decision-making; target sustained remission or low disease activity in every patient','Start MTX in the first strategy (short-term GC); if MTX contraindicated/intolerant, leflunomide or sulfasalazine','If target missed on csDMARD strategy at 3–6 months, add a bDMARD; stratification by prognostic risk factors is no longer used','JAK inhibitors may be considered after weighing MACE, malignancy, thromboembolic risk','After failure of a bDMARD or JAKi, another bDMARD or JAKi is an option; biosimilars acceptable','Guidance on tapering after sustained remission'])+`<p class="src">Sources: Ann Rheum Dis 2026, doi:10.1016/j.ard.2026.01.023; RheumNow summary (Mar 2026); Oxford Textbook of RA update (Sep 2025). Also consult ACR guidelines for US practice.</p>`)+
card('Harrison’s vs latest',li(['Harrison’s (2018-era): MTX first, step up at 3–6 months to triple therapy or biologic, based partly on ACR 2015','Current practice: risk stratification dropped; add biologic after MTX-strategy failure; JAKi use constrained by safety data','Always check your regional guidance (e.g. IRA India) and drug availability']));

function calc(){
 const g=id=>$(id)?+$(id).value||0:0;
 if($('j')){const t=g('j')+g('s')+g('a')+g('d');$('cls').innerHTML=t+' / 10';$('cls2').innerHTML=t>=6?'<span class="ok">≥6: classified as definite RA</span>':'<span class="wa">&lt;6: not yet classifiable; reassess over time</span>';
 const n=[...document.querySelectorAll('.sy')].filter(x=>x.checked).length;$('syo').textContent=n+' of 7 features ticked'+(n>=4?' – high clinical suspicion; refer early':'')}
 if($('tj')&&($('tj').value||$('sj').value||$('pg').value||$('eg').value)){
  const c=g('tj')+g('sj')+g('pg')+g('eg'),s=c+g('crp');
  const lv=(v,a,b,d)=>v<=a?['Remission','ok']:v<=b?['Low','ok']:v<=d?['Moderate','wa']:['High','bad'];
  const x=lv(c,2.8,10,22),y=lv(s,3.3,11,26);
  $('da').innerHTML=`<p>CDAI <b>${c.toFixed(1)}</b> – <span class="${x[1]}">${x[0]}</span>`+($('crp').value?`<br>SDAI <b>${s.toFixed(1)}</b> – <span class="${y[1]}">${y[0]}</span>`:'')+`</p><p class="src">${x[1]=='ok'?'Target met: continue and monitor; consider tapering after sustained remission.':'Target not met: intensify therapy per Treatment tab.'}</p>`}
}
function go(k){location.hash=k;$('m').innerHTML=V[k]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));scrollTo(0,0)}
$('nav').innerHTML=S.map(s=>`<button data-k="${s[0]}" onclick="go('${s[0]}')">${s[1]}</button>`).join('');
go(S.some(s=>'#'+s[0]==location.hash)?location.hash.slice(1):'assess');
</script></body></html>
